# Clase 1
spring.application.name=tienda
#para definir el puerto donde "escuchará" el servidor
server.port=8080

#Clase 2
#Para definir el formato de despliegue de fecha/hora del log en la consola
logging.pattern.dateformat=hh:mm
 
#Para eliminar mensajes invasivos de Spring
spring.main.banner-mode=off
 
#En desarrollo el "cache" del servidor (false), en producción "true"
spring.thymeleaf.cache=false

#Clase 3
#Conexion local a la BD TechShop en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/techshop

#Conexión nube aiven a la BD TechShop en MySQL
spring.datasource.url=jdbc:mysql://techshop-nacholb1107-c289.j.aivencloud.com:14973/techshop

#Usuario y clave de creaTablas.sql
spring.datasource.username=root
spring.datasource.password=shelos11

#Driver y plataforma de comunicacion
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-plataform=org.hibernate.dialect.MySQLDialect

#Mostrar informacion en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE

